<!doctype html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101b1b" />
    <meta name="description" content="Plane deinen Urlaub mit gesetzlichen Feiertagen, Restbudget und einer klaren Jahresübersicht. Ohne Anmeldung." />
    <title>urlaubsjahr · Dein Urlaubsplaner</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('urlaubsjahr-theme') === 'light' ? 'light' : 'dark';
      } catch (error) {
        console.warn('Die gespeicherte Darstellung konnte nicht gelesen werden.', error);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
